<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マスタ管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-inner">
        <h1 class="header-title">🏭 マスタ管理</h1>
        <nav class="header-nav">
          <a href="index.html" class="nav-link">入力画面</a>
          <a href="dashboard.html" class="nav-link">ダッシュボード</a>
        </nav>
      </div>
    </header>

    <main class="main">
      <!-- タブ -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="machines">機械マスタ</button>
        <button class="tab-btn" data-tab="products">品目マスタ</button>
      </div>

      <!-- 機械マスタ -->
      <section class="card" id="tab-machines">
        <h2 class="card-title">機械マスタ</h2>
        <form id="machine-form" class="master-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">工程名</label>
              <input type="text" id="m-process" class="form-input" placeholder="例：打錠工程">
            </div>
            <div class="form-group">
              <label class="form-label">機械名</label>
              <input type="text" id="m-name" class="form-input" placeholder="例：AQUARIUS G-J2">
            </div>
            <div class="form-group">
              <label class="form-label">休憩パターン</label>
              <select id="m-break" class="form-input">
                <option value="60">1:00（60分）</option>
                <option value="15">0:15（15分）</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">追加</button>
        </form>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>工程</th><th>機械名</th><th>休憩</th><th>操作</th></tr>
            </thead>
            <tbody id="machine-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- 品目マスタ -->
      <section class="card hidden" id="tab-products">
        <h2 class="card-title">品目マスタ</h2>
        <form id="product-form" class="master-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">品目名</label>
              <input type="text" id="p-name" class="form-input" placeholder="例：カンシャ">
            </div>
            <div class="form-group">
              <label class="form-label">ショット数</label>
              <input type="number" id="p-shot" class="form-input" placeholder="例：16800" min="0">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">追加</button>
        </form>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>品目名</th><th>ショット数</th><th>操作</th></tr>
            </thead>
            <tbody id="product-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/master.js"></script>
</body>
</html>
